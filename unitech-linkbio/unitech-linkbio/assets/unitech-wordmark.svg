<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="textFill" x1="100" y1="40" x2="1020" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="0.5" stop-color="#DDEAFD"/>
      <stop offset="1" stop-color="#B7D5FF"/>
    </linearGradient>
  </defs>

  <g filter="url(#glow)">
    <text x="600" y="210" text-anchor="middle" font-size="190" font-weight="700" fill="url(#textFill)" font-family="'Segoe UI', 'Arial', sans-serif" letter-spacing="-5">UniTech</text>
  </g>

  <text x="600" y="210" text-anchor="middle" font-size="190" font-weight="700" fill="none" stroke="#7FD9FF" stroke-width="4" opacity="0.65" font-family="'Segoe UI', 'Arial', sans-serif" letter-spacing="-5">UniTech</text>
</svg>
